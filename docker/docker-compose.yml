services:
  prodml-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ahmedfoly/prodml-api:0.1.0
    container_name: prodml-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PRODML_SERVER_HOST=0.0.0.0
      - PRODML_SERVER_PORT=8000
      - PRODML_LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models:ro
