[project]
name = "mlops-practitioner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "boto3>=1.35.0",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.8.0",
    "mlflow>=2.20.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "optuna>=4.0.0",
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.7",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "torch>=2.0.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]

[project.scripts]
prodml-train = "prodml.train:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
